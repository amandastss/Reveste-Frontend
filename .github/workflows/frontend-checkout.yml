name: Frontend checkout checks

on:
  push:
    branches: [FEAT-3]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: http://localhost:8000
      VITE_MERCADO_PAGO_PUBLIC_KEY: TEST_PUBLIC_KEY
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run type-check
      - name: Run tests
        run: npm run test
      - name: Build production bundle
        run: npm run build

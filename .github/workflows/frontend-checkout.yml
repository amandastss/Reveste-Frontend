name: Frontend checkout checks

on:
  push:
    branches: [integration/feat-3-safe-checkout]
  pull_request:
    branches: [main]

jobs:
  checkout:
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: http://localhost:8000
      VITE_MERCADO_PAGO_PUBLIC_KEY: TEST_PUBLIC_KEY
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test order payment status
        run: node --test scripts/payment-order-status.test.mjs
      - name: Type check and production build
        run: npm run build
